<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge du 06/11/2026</title>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e1b4b;
    --gold:#fbbf24; --silver:#cbd5e1; --bronze:#d97706;
    --green:#22c55e; --text:#f8fafc; --muted:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 70%);
    color:var(--text);
  }
  .slides{display:flex;height:100%;width:200%;transition:transform .6s cubic-bezier(.7,0,.2,1)}
  .slide{width:50%;height:100%;padding:28px 6vw 70px;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
  h1{font-size:clamp(1.8rem,5vw,3.2rem);text-align:center;color:var(--gold);letter-spacing:1px;text-shadow:0 0 30px rgba(251,191,36,.35)}
  .sub{color:var(--muted);margin:8px 0 28px;text-align:center;font-size:1.05rem}

  /* ---- Page 1 : trophées ---- */
  .trophies{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-end;margin:auto 0}
  .card{
    width:250px;padding:26px 18px;border-radius:22px;text-align:center;
    background:rgba(255,255,255,.06);border:2px solid var(--c);
    box-shadow:0 0 35px color-mix(in srgb,var(--c) 30%,transparent);
    animation:float 3.5s ease-in-out infinite;
  }
  .card.t8{animation-delay:.4s}.card.t10{animation-delay:.8s}
  .card .cup{font-size:4.2rem;filter:drop-shadow(0 0 12px var(--c))}
  .card.t10 .cup{font-size:5.6rem}
  .card .n{font-size:1.5rem;font-weight:700;margin-top:6px}
  .card .prize{font-size:2.4rem;font-weight:800;color:var(--c);margin-top:8px}
  .card .lvl{color:var(--muted);font-size:.9rem;margin-top:4px;text-transform:uppercase;letter-spacing:2px}
  .t6{--c:var(--bronze)} .t8{--c:var(--silver)} .t10{--c:var(--gold);transform:scale(1.08)}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}

  /* ---- Page 2 : réalisé ---- */
  .total{margin-bottom:18px;color:var(--muted)}
  .total b{color:var(--gold);font-size:1.3rem}
  .agents{width:100%;max-width:900px;display:flex;flex-direction:column;gap:16px}
  .agent{background:rgba(255,255,255,.06);border-radius:16px;padding:14px 18px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .name{font-weight:700;font-size:1.15rem}
  .badge{font-size:.9rem;font-weight:700;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--muted)}
  .badge.b6{background:var(--bronze);color:#000}
  .badge.b8{background:var(--silver);color:#000}
  .badge.b10{background:var(--gold);color:#000}
  .count{font-weight:800;font-size:1.3rem}
  .count small{color:var(--muted);font-weight:400;font-size:.85rem}
  .track{position:relative;height:22px;border-radius:99px;background:rgba(255,255,255,.1);overflow:visible}
  .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#6366f1);transition:width 1.2s ease}
  .fill.l6{background:linear-gradient(90deg,#b45309,var(--bronze))}
  .fill.l8{background:linear-gradient(90deg,#94a3b8,var(--silver))}
  .fill.l10{background:linear-gradient(90deg,#f59e0b,var(--gold));box-shadow:0 0 18px var(--gold)}
  .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.45)}
  .mark span{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap}
  .agent{padding-bottom:30px}

  /* ---- Navigation ---- */
  nav{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px}
  nav button{background:rgba(255,255,255,.12);border:none;color:var(--text);width:42px;height:42px;border-radius:50%;font-size:1.3rem;cursor:pointer}
  nav button:hover{background:rgba(255,255,255,.25)}
  .dots{display:flex;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}
  .dot.on{background:var(--gold)}
</style>
</head>
<body>

<div class="slides" id="slides">

  <!-- PAGE 1 -->
  <section class="slide">
    <h1>🏆 Challenge du 06/11/2026 🏆</h1>
    <p class="sub">Réalisez des services et gagnez des primes !</p>
    <div class="trophies">
      <div class="card t6">
        <div class="cup">🥉</div>
        <div class="n">6 services</div>
        <div class="prize">100 DHS</div>
        <div class="lvl">Bronze</div>
      </div>
      <div class="card t8">
        <div class="cup">🥈</div>
        <div class="n">8 services</div>
        <div class="prize">200 DHS</div>
        <div class="lvl">Argent</div>
      </div>
      <div class="card t10">
        <div class="cup">🏆</div>
        <div class="n">10 services</div>
        <div class="prize">400 DHS</div>
        <div class="lvl">Or</div>
      </div>
    </div>
  </section>

  <!-- PAGE 2 -->
  <section class="slide">
    <h1>📊 Réalisé des agents</h1>
    <p class="sub" id="mois"></p>
    <div class="total" id="total"></div>
    <div class="agents" id="agents"></div>
  </section>

</div>

<nav>
  <button id="prev" aria-label="Précédent">‹</button>
  <div class="dots"><span class="dot on"></span><span class="dot"></span></div>
  <button id="next" aria-label="Suivant">›</button>
</nav>

<script src="data.js"></script>
<script>
  const MAX = 10;
  const data = window.CHALLENGE_DATA || {mois:"",agents:[]};

  function prime(n){ return n>=10 ? 400 : n>=8 ? 200 : n>=6 ? 100 : 0; }
  function level(n){ return n>=10 ? 10 : n>=8 ? 8 : n>=6 ? 6 : 0; }

  // ----- Rendu de la page 2 -----
  document.getElementById("mois").textContent = data.mois;
  const agents = [...data.agents].sort((a,b)=>b.services-a.services);
  const total = agents.reduce((s,a)=>s+a.services,0);
  document.getElementById("total").innerHTML =
    `Total du mois : <b>${total}</b> services réalisés`;

  const box = document.getElementById("agents");
  agents.forEach((a,i)=>{
    const lv = level(a.services), p = prime(a.services);
    const medal = i===0 ? "🥇 " : i===1 ? "🥈 " : i===2 ? "🥉 " : "";
    const pct = Math.min(a.services/MAX*100,100);
    const el = document.createElement("div");
    el.className = "agent";
    el.innerHTML = `
      <div class="row">
        <span class="name">${medal}${a.nom}</span>
        <span class="badge ${lv?'b'+lv:''}">${p ? "Prime : "+p+" DHS" : "Pas encore de prime"}</span>
        <span class="count">${a.services} <small>/ ${MAX} services</small></span>
      </div>
      <div class="track">
        <div class="fill ${lv?'l'+lv:''}" data-w="${pct}"></div>
        <div class="mark" style="left:60%"><span>6 · 100 DHS</span></div>
        <div class="mark" style="left:80%"><span>8 · 200 DHS</span></div>
        <div class="mark" style="left:100%"><span>10 · 400 DHS</span></div>
      </div>`;
    box.appendChild(el);
  });

  function animateBars(){
    document.querySelectorAll(".fill").forEach(f=>{
      f.style.width="0";
      requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width=f.dataset.w+"%"));
    });
  }

  // ----- Navigation entre les 2 pages -----
  let page = 0;
  const slides = document.getElementById("slides");
  const dots = document.querySelectorAll(".dot");
  function go(n){
    page = Math.max(0,Math.min(1,n));
    slides.style.transform = `translateX(-${page*50}%)`;
    dots.forEach((d,i)=>d.classList.toggle("on",i===page));
    if(page===1) animateBars();
  }
  document.getElementById("prev").onclick=()=>go(page-1);
  document.getElementById("next").onclick=()=>go(page+1);
  dots.forEach((d,i)=>d.onclick=()=>go(i));
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight") go(page+1);
    if(e.key==="ArrowLeft") go(page-1);
  });
  let x0=null;
  document.addEventListener("touchstart",e=>x0=e.touches[0].clientX);
  document.addEventListener("touchend",e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>50) go(page+(dx<0?1:-1));
    x0=null;
  });
</script>
</body>
</html>
