<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge de la semaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#12002b;cursor:none}
body{font-family:'Poppins','Segoe UI',Arial,sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:#12002b}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;transition:opacity .9s ease;overflow:hidden}
.slide.active{opacity:1}
svg.defs{position:absolute;width:0;height:0}

/* ---------- barre de progression ---------- */
#prog{position:absolute;left:0;bottom:0;height:8px;width:0;z-index:50;background:linear-gradient(90deg,#ffd23f,#ff7b00,#f72585);box-shadow:0 0 14px rgba(255,180,0,.8)}
#dots{position:absolute;right:40px;bottom:22px;z-index:50;display:flex}
#dots i{width:14px;height:14px;border-radius:50%;background:rgba(128,128,128,.45);margin-left:10px;transition:all .4s}
#dots i.on{background:#ffd23f;transform:scale(1.25);box-shadow:0 0 10px #ffd23f}
#err{position:absolute;left:10px;top:10px;width:14px;height:14px;border-radius:50%;background:#e11;z-index:60;opacity:0}
#err.show{opacity:.5}

/* =====================  SLIDE 1  ===================== */
.s1{background:linear-gradient(120deg,#2b0a8f,#7209b7,#f72585,#ff7b00,#f72585,#7209b7,#2b0a8f);background-size:500% 500%;animation:bgshift 16s ease-in-out infinite}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.s1 .rays{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;
 background:repeating-conic-gradient(rgba(255,255,255,.10) 0 7deg,rgba(255,255,255,0) 7deg 15deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);
 animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.b1{width:620px;height:620px;left:-160px;top:-160px;background:#8a5bff;animation:drift 12s ease-in-out infinite alternate}
.b2{width:720px;height:720px;right:-220px;bottom:-260px;background:#ffd23f;animation:drift 15s ease-in-out infinite alternate-reverse}
.b3{width:420px;height:420px;left:40%;top:62%;background:#ff3d81;animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(80px,60px) scale(1.2)}}
#confetti{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}

.logos{position:absolute;right:56px;top:40px;height:116px;padding:0 34px;display:flex;align-items:center;
 background:rgba(255,255,255,.96);border-radius:30px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 4px rgba(255,255,255,.35);z-index:10;
 opacity:0;transform:translateY(-40px) scale(.9)}
.s1.on .logos{animation:dropin .9s .2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes dropin{to{opacity:1;transform:none}}
.logos .plus{font-size:50px;font-weight:800;color:#c4c4d0;margin:0 26px}
.logos img{height:76px;display:block}
.logo-fb{display:flex;align-items:center}
.eol-fb{font-weight:900;font-size:56px;letter-spacing:3px;color:#fff;padding:2px 22px;border-radius:16px;background:linear-gradient(135deg,#0d9f4f,#087a3b);line-height:76px}
.ony-fb{line-height:1;text-align:left}
.ony-fb b{display:block;font-size:50px;font-weight:900;color:#5b21b6;letter-spacing:-1px}
.ony-fb small{display:block;font-size:22px;font-weight:700;color:#8b5cf6;letter-spacing:5px;text-transform:uppercase;margin-top:4px}

.center{position:absolute;left:0;top:0;width:1920px;text-align:center}
.kicker{position:absolute;left:0;width:1920px;text-align:center;top:178px;font-size:34px;font-weight:700;letter-spacing:10px;color:#fff;text-transform:uppercase;opacity:0}
.kicker span{display:inline-block;padding:10px 38px;border-radius:50px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.4)}
.s1.on .kicker{animation:fadeup .8s .5s ease forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.t1,.t2{position:absolute;left:0;width:1920px;text-align:center;font-weight:900;text-transform:uppercase;line-height:1;opacity:0;
 background:linear-gradient(100deg,#fff 0%,#fff6c2 30%,#ffd23f 48%,#fff 52%,#fff 100%);background-size:250% 100%;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
 filter:drop-shadow(0 10px 0 rgba(60,0,90,.45)) drop-shadow(0 18px 26px rgba(0,0,0,.4))}
.t1{top:262px;font-size:196px;letter-spacing:4px}
.t2{top:468px;font-size:128px;letter-spacing:8px}
.s1.on .t1{animation:titlein .9s .75s cubic-bezier(.2,1.3,.4,1) forwards,shine 3.2s 1.8s ease-in-out infinite}
.s1.on .t2{animation:titlein .9s 1s cubic-bezier(.2,1.3,.4,1) forwards,shine 3.2s 2.1s ease-in-out infinite}
@keyframes titlein{from{opacity:0;transform:scale(.5) translateY(60px)}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}

.pill{position:absolute;left:50%;top:640px;margin-left:-440px;width:880px;height:150px;border-radius:80px;
 display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:900;letter-spacing:3px;white-space:nowrap;
 background:linear-gradient(180deg,#1b0b4d,#0a0224);border:5px solid #ffd23f;opacity:0;transform:scale(.3);
 box-shadow:0 0 0 0 rgba(255,210,63,.6),0 16px 40px rgba(0,0,0,.45)}
.pill em{font-style:normal;color:#ffd23f;margin:0 26px}
.s1.on .pill{animation:pillin .8s 1.5s cubic-bezier(.2,1.5,.4,1) forwards,pulse 1.8s 2.4s ease-out infinite}
@keyframes pillin{to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,63,.65),0 16px 40px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 46px rgba(255,210,63,0),0 16px 40px rgba(0,0,0,.45)}}
.val{position:absolute;left:0;width:1920px;text-align:center;top:838px;font-size:58px;font-weight:700;letter-spacing:4px;text-transform:uppercase;opacity:0;
 text-shadow:0 5px 18px rgba(0,0,0,.45)}
.val b{color:#ffd23f;font-weight:900;font-size:76px}
.s1.on .val{animation:fadeup .8s 2s ease forwards}

.trophy{position:absolute;opacity:0;filter:drop-shadow(0 20px 30px rgba(0,0,0,.45))}
.trophy svg{width:100%;height:100%;display:block;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 16px rgba(255,210,63,.55))}50%{filter:drop-shadow(0 0 46px rgba(255,235,120,1))}}
.tl{left:70px;top:420px;width:330px;height:396px}
.tr{right:70px;top:420px;width:330px;height:396px}
.tc{left:210px;top:810px;width:150px;height:180px}
.td{right:210px;top:810px;width:150px;height:180px}
.s1.on .tl{animation:trophyin 1s .9s cubic-bezier(.2,1.4,.4,1) forwards,bob 3.4s 2s ease-in-out infinite}
.s1.on .tr{animation:trophyin 1s 1.1s cubic-bezier(.2,1.4,.4,1) forwards,bob 3.4s 2.4s ease-in-out infinite reverse}
.s1.on .tc{animation:trophyin 1s 1.5s cubic-bezier(.2,1.4,.4,1) forwards,bob 2.8s 2.5s ease-in-out infinite}
.s1.on .td{animation:trophyin 1s 1.7s cubic-bezier(.2,1.4,.4,1) forwards,bob 2.8s 2.9s ease-in-out infinite reverse}
@keyframes trophyin{from{opacity:0;transform:translateY(200px) scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-26px) rotate(3deg)}}
.spark{position:absolute;width:44px;height:44px;background:#fff;opacity:0;
 clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 8px #fff)}
.s1.on .spark{animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}

/* =====================  SLIDE 2  ===================== */
.s2{background:#fff}
.s2 .glow{position:absolute;left:0;top:0;width:1920px;height:300px;background:radial-gradient(ellipse at 20% 0,rgba(46,158,79,.16),transparent 65%)}
.s2 h1{position:absolute;left:60px;top:34px;font-size:60px;font-weight:800;color:#1B5E20;line-height:1.1;opacity:0}
.s2 .sub{position:absolute;left:60px;top:112px;font-size:27px;color:#595959;font-weight:500;opacity:0}
.s2.on h1{animation:fadeup .7s .1s ease forwards}
.s2.on .sub{animation:fadeup .7s .25s ease forwards}
.remain{position:absolute;right:60px;top:34px;height:96px;padding:0 40px;border-radius:50px;background:linear-gradient(135deg,#2E9E4F,#1B5E20);
 display:flex;align-items:center;font-size:30px;font-weight:600;box-shadow:0 10px 24px rgba(27,94,32,.35);opacity:0}
.remain b{font-size:56px;font-weight:900;margin:0 12px 0 0;line-height:1}
.s2.on .remain{animation:fadeup .7s .35s ease forwards}
#grid{position:absolute;left:60px;top:176px;width:1800px}
.grow{display:flex;justify-content:center;margin-bottom:14px}
.tile{position:relative;width:168px;height:128px;margin:0 7px;border-radius:14px;background:#2E9E4F;color:#fff;
 display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 8px;font-size:24px;font-weight:700;line-height:1.15;
 box-shadow:0 4px 0 #1f7a38,0 8px 14px rgba(27,94,32,.25);transition:background .8s,color .8s,box-shadow .8s;opacity:0}
.tile.cash{font-size:38px;font-weight:800}
.tile .n{position:absolute;left:10px;top:6px;font-size:14px;font-weight:600;opacity:.65}
.s2.on .tile{animation:pop .55s calc(var(--i)*22ms + .3s) cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(30px)}to{opacity:1;transform:none}}
.tile.won{background:#C8C8C8;color:#8a8a8a;box-shadow:0 4px 0 #adadad}
.tile.won .t{text-decoration:line-through;text-decoration-thickness:3px}
.tile.won::after{content:"\2713";position:absolute;right:10px;top:4px;font-size:22px;font-weight:800;color:#6d6d6d}

/* =====================  SLIDE 3  ===================== */
.s3{background:radial-gradient(ellipse at 50% 0,#0f4a3c 0,#081c2e 55%,#050b16 100%)}
.s3 .grid3d{position:absolute;left:-200px;right:-200px;bottom:-300px;height:900px;opacity:.18;
 background:linear-gradient(rgba(80,255,170,.8) 1px,transparent 1px) 0 0/100% 60px,linear-gradient(90deg,rgba(80,255,170,.8) 1px,transparent 1px) 0 0/80px 100%;
 transform:perspective(600px) rotateX(62deg);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.s3 h1{position:absolute;left:60px;top:26px;font-size:62px;font-weight:800;line-height:1.1;opacity:0}
.s3 h1 span{color:#5CFFA8}
.s3 .sub{position:absolute;left:62px;top:104px;font-size:28px;color:#9fb8c9;font-weight:500;opacity:0}
.s3.on h1{animation:fadeup .7s .1s ease forwards}
.s3.on .sub{animation:fadeup .7s .25s ease forwards}
.total{position:absolute;right:60px;top:30px;height:96px;padding:0 40px;border-radius:50px;display:flex;align-items:center;font-size:30px;font-weight:600;
 background:rgba(255,255,255,.08);border:2px solid rgba(92,255,168,.5);opacity:0}
.total b{font-size:56px;font-weight:900;color:#ffd23f;margin-right:14px;line-height:1}
.s3.on .total{animation:fadeup .7s .35s ease forwards}
#rows{position:absolute;left:0;top:0}
.row{position:absolute;left:0;top:0;width:880px;height:100px;display:flex;align-items:center;
 transition:transform 1s cubic-bezier(.3,1,.3,1);opacity:0}
@keyframes fadein{to{opacity:1}}
.s3.on .row{animation:fadein .6s calc(var(--i)*60ms + .3s) ease forwards}
.rank{flex:none;width:68px;height:68px;border-radius:50%;margin-right:22px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;
 background:radial-gradient(circle at 35% 28%,#3b5a72,#14283a 70%);color:#cfe3f0;box-shadow:0 6px 0 #0a1622,0 10px 18px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.25)}
.rank.r1{background:radial-gradient(circle at 35% 28%,#fff3a6,#ffc933 45%,#b97800);color:#4a3000;box-shadow:0 6px 0 #7a5000,0 10px 20px rgba(255,200,0,.4)}
.rank.r2{background:radial-gradient(circle at 35% 28%,#fff,#cfd6de 45%,#7f8a96);color:#2d3640;box-shadow:0 6px 0 #5a636d,0 10px 18px rgba(0,0,0,.4)}
.rank.r3{background:radial-gradient(circle at 35% 28%,#ffd9b0,#d98a4a 45%,#8a4a1c);color:#3a1d08;box-shadow:0 6px 0 #5e3212,0 10px 18px rgba(0,0,0,.4)}
.main{flex:1;min-width:0}
.top{display:flex;align-items:baseline;justify-content:space-between;height:40px;margin-bottom:6px}
.nm{font-size:29px;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .nm{color:#ffd23f}
.sc{flex:none;margin-left:16px;font-size:40px;font-weight:900;line-height:1;display:flex;align-items:baseline}
.sc i{font-style:normal;font-size:24px;font-weight:600;color:#7f9bb0;margin-left:4px}
.sc .tr-ic{display:none;width:34px;height:40px;margin-right:12px;align-self:center}
.row.done .tr-ic{display:block}
.tube{position:relative;height:38px;border-radius:19px;margin-right:22px;
 background:linear-gradient(#040a12,#16223a 60%,#0d1628);
 box-shadow:inset 0 5px 9px rgba(0,0,0,.85),inset 0 -2px 3px rgba(255,255,255,.1),0 6px 0 #0a1424,0 12px 20px rgba(0,0,0,.55)}
.tube .fill{position:absolute;left:0;top:0;bottom:0;border-radius:19px;width:calc(var(--p,0) * 1%);
 background:linear-gradient(to bottom,var(--cl,#fff) 0%,var(--cm,#2c2) 48%,var(--cd,#171) 100%);
 box-shadow:0 6px 0 var(--cdd,#050),0 0 26px var(--glow,transparent);
 transition:width 1.5s cubic-bezier(.2,.9,.25,1)}
.tube .fill::after{content:"";position:absolute;right:-7px;top:50%;width:56px;height:56px;margin-top:-28px;border-radius:50%;
 background:radial-gradient(circle at 34% 28%,#fff 0,var(--cl,#fff) 16%,var(--cm,#2c2) 50%,var(--cd,#171) 100%);
 box-shadow:0 8px 10px rgba(0,0,0,.5),0 0 22px var(--glow,transparent)}
.tube.zero .fill::after{display:none}
.tube .fill::before{content:"";position:absolute;left:12px;right:30px;top:5px;height:8px;border-radius:5px;background:rgba(255,255,255,.55);filter:blur(1px)}
.tube .ticks{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:19px;pointer-events:none;
 background:repeating-linear-gradient(90deg,transparent 0,transparent calc(4% - 1px),rgba(0,0,0,.28) calc(4% - 1px),rgba(0,0,0,.28) 4%),
 repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 2px),rgba(255,255,255,.28) calc(20% - 2px),rgba(255,255,255,.28) 20%)}
.row.done .tube .fill{animation:goldpulse 1.6s ease-in-out infinite}
@keyframes goldpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
</style>
</head>

<div id="stage">

  <!-- ============ PAGE 1 : TITRE ============ -->
  <section class="slide s1" id="s1">
    <div class="rays"></div>
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <canvas id="confetti" width="1920" height="1080"></canvas>

    <div class="logos">
      <div class="logo-fb" id="fbEol"><img src="logos/eol.png" alt="EOL" onerror="this.parentNode.innerHTML='<span class=&quot;eol-fb&quot;>EOL</span>'"></div>
      <span class="plus">+</span>
      <div class="logo-fb" id="fbOny"><img src="logos/onlyoo.png" alt="Onlyoo Proximus" onerror="this.parentNode.innerHTML='<span class=&quot;ony-fb&quot;><b>Onlyoo</b><small>Proximus</small></span>'"></div>
    </div>

    <div class="kicker"><span>9 · 10 · 12 novembre 2026</span></div>
    <div class="t1">Challenge</div>
    <div class="t2">de la semaine</div>
    <div class="pill">1 VENTE<em>=</em>1 LOT</div>
    <div class="val">d'une valeur de <b>50</b> à <b id="val">1 700</b> <b>DHS</b></div>

    <div class="trophy tl"><svg viewBox="0 0 200 240"><use href="#trophy"/></svg></div>
    <div class="trophy tr"><svg viewBox="0 0 200 240"><use href="#trophy"/></svg></div>
    <div class="trophy tc"><svg viewBox="0 0 200 240"><use href="#trophy"/></svg></div>
    <div class="trophy td"><svg viewBox="0 0 200 240"><use href="#trophy"/></svg></div>
    <div class="spark" style="left:60px;top:400px;animation-delay:1.8s"></div>
    <div class="spark" style="left:380px;top:520px;animation-delay:2.3s;width:30px;height:30px"></div>
    <div class="spark" style="left:150px;top:800px;animation-delay:2.8s;width:34px;height:34px"></div>
    <div class="spark" style="left:1480px;top:430px;animation-delay:2.1s;width:34px;height:34px"></div>
    <div class="spark" style="left:1810px;top:560px;animation-delay:1.6s"></div>
    <div class="spark" style="left:1690px;top:820px;animation-delay:2.6s;width:30px;height:30px"></div>
  </section>

  <!-- ============ PAGE 2 : LOTS ============ -->
  <section class="slide s2" id="s2">
    <div class="glow"></div>
    <h1>Incentive – Lots à gagner</h1>
    <div class="sub" id="subLots"></div>
    <div class="remain"><b id="remN">55</b><span>lots restants</span></div>
    <div id="grid"></div>
  </section>

  <!-- ============ PAGE 3 : AGENTS ============ -->
  <section class="slide s3" id="s3">
    <div class="grid3d"></div>
    <h1>Résultat <span>Novembre</span></h1>
    <div class="sub" id="subAg"></div>
    <div class="total"><b id="totN">0</b><span>ventes au total</span></div>
    <div id="rows"></div>
  </section>

  <div id="prog"></div>
  <div id="dots"><i></i><i></i><i></i></div>
  <div id="err" title="Erreur dans le bloc de configuration"></div>
</div>

<script>
/* Liste des lots (extraite du fichier PowerPoint) — n° = position, de gauche à droite et de haut en bas */
var LOTS = ["Bouteille en Verre", "Coffret Senteur", "Valise", "150 Dhs", "Pots de Rangement", "Bouteille en Verre", "Kit Tournevis", "50 Dhs", "Centrifugeuse Bosch", "150 Dhs", "Montre / Alarme Multifonction", "Couverture Polaire", "Bouteille en Verre", "Écouteurs Bluetooth", "50 Dhs", "Verres à thé", "Pots de Rangement", "Bol en Verre", "50 Dhs", "Gels Douche", "Verres à thé", "100 Dhs", "Pots de Rangement", "Montre / Alarme Multifonction", "Couverture Polaire", "Bouteille en Verre", "Coffret Senteur", "Valise", "Blender", "100 Dhs", "100 Dhs", "Couverture Polaire", "Montre / Alarme Multifonction", "Pots de Rangement", "Coffret Senteur", "Montre / Alarme Multifonction", "100 Dhs", "150 Dhs", "Montre / Alarme Multifonction", "50 Dhs", "Bol en Verre", "200 Dhs", "Gels Douche", "Bol en Verre", "100 Dhs", "50 Dhs", "Couverture Polaire", "50 Dhs", "Écouteurs Bluetooth", "Bouteille en Verre", "Kit Tournevis", "Pots de Rangement", "100 Dhs", "Pots de Rangement", "Gels Douche"];

var stage = document.getElementById('stage');
var CFG = null;

/* ---------- mise à l'échelle 1920x1080 ---------- */
function fit(){
  var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* ---------- configuration ---------- */
function parseCfg(txt){
  var c = JSON.parse(txt);
  if(!c.agents || !c.agents.length) throw new Error('agents');
  c.objectif = Number(c.objectif) || 25;
  c.dureeSlide = Number(c.dureeSlide) || 10;
  c.rafraichissement = Math.max(5, Number(c.rafraichissement) || 15);
  c.lotsGagnes = c.lotsGagnes || [6];
  return c;
}
var errEl = document.getElementById('err');
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

/* =====================  PAGE 2 : LOTS  ===================== */
var gridEl = document.getElementById('grid');
var tiles = [];
(function buildGrid(){
  var row, i;
  for(i=0;i<LOTS.length;i++){
    if(i % 10 === 0){ row = document.createElement('div'); row.className = 'grow'; gridEl.appendChild(row); }
    var t = document.createElement('div');
    t.className = 'tile' + (/dhs$/i.test(LOTS[i]) ? ' cash' : '');
    t.style.setProperty('--i', i);
    t.innerHTML = '<span class="n">' + (i+1) + '</span><span class="t">' + LOTS[i] + '</span>';
    row.appendChild(t); tiles.push(t);
  }
})();
function updateLots(cfg){
  var won = {}, k, n = 0;
  for(k=0;k<cfg.lotsGagnes.length;k++) won[cfg.lotsGagnes[k]] = true;
  for(k=0;k<tiles.length;k++){
    var w = !!won[k+1]; if(w) n++;
    tiles[k].classList.toggle('won', w);
  }
  document.getElementById('remN').textContent = LOTS.length - n;
  document.getElementById('subLots').textContent = '9, 10 et 12 novembre 2026  ·  ' + LOTS.length + ' lots  ·  vert = disponible, gris = déjà tiré';
}

/* =====================  PAGE 3 : AGENTS  ===================== */
var rowsEl = document.getElementById('rows');
var rowObjs = [], sig = '';
var COL_X = [60, 980], ROW_Y0 = 196, ROW_H = 104, PER_COL = 8;

function colorFor(pct, done){
  if(done) return {cl:'#fff6b8',cm:'#ffc933',cd:'#e09b00',cdd:'#7a4e00',glow:'rgba(255,210,63,.75)'};
  var h = Math.round(pct * 1.2); /* 0 = rouge -> 120 = vert */
  return {cl:'hsl('+h+',95%,70%)', cm:'hsl('+h+',88%,52%)', cd:'hsl('+h+',90%,34%)', cdd:'hsl('+h+',85%,18%)', glow:'hsla('+h+',100%,55%,.55)'};
}
function buildRows(cfg){
  rowsEl.innerHTML = ''; rowObjs = [];
  for(var i=0;i<cfg.agents.length;i++){
    var el = document.createElement('div');
    el.className = 'row'; el.style.setProperty('--i', i);
    el.innerHTML =
      '<div class="rank">–</div>' +
      '<div class="main"><div class="top"><span class="nm"></span>' +
      '<span class="sc"><svg class="tr-ic" viewBox="0 0 200 240"><use href="#trophy"/></svg><b>0</b><i>/25</i></span></div>' +
      '<div class="tube zero"><div class="fill"></div><div class="ticks"></div></div></div>';
    el.querySelector('.nm').textContent = cfg.agents[i].nom;
    rowsEl.appendChild(el);
    rowObjs.push({el:el, rank:el.querySelector('.rank'), num:el.querySelector('.sc b'), goal:el.querySelector('.sc i'),
      tube:el.querySelector('.tube'), fill:el.querySelector('.fill'), shown:0, target:0});
  }
}
var countTimers = [];
function countTo(o, to, ms, delay){
  clearTimeout(o.ct); cancelAnimationFrame(o.raf);
  var from = o.shown, start = null;
  function step(ts){
    if(start === null) start = ts;
    var p = Math.min(1, (ts - start) / ms), e = 1 - Math.pow(1 - p, 3);
    var v = Math.round(from + (to - from) * e);
    o.num.textContent = v; o.shown = v;
    if(p < 1) o.raf = requestAnimationFrame(step);
  }
  o.ct = setTimeout(function(){ o.raf = requestAnimationFrame(step); }, delay || 0);
}
function setGauge(o, score, cfg, delay){
  var goal = cfg.objectif;
  var pct = Math.max(0, Math.min(100, score / goal * 100));
  var done = score >= goal;
  var c = colorFor(pct, done);
  var f = o.fill.style;
  f.setProperty('--cl', c.cl); f.setProperty('--cm', c.cm); f.setProperty('--cd', c.cd); f.setProperty('--cdd', c.cdd); f.setProperty('--glow', c.glow);
  f.transitionDelay = (delay || 0) + 'ms';
  f.setProperty('--p', pct);
  o.tube.classList.toggle('zero', score <= 0);
  o.el.classList.toggle('done', done);
  o.goal.textContent = '/' + goal;
  countTo(o, score, 1400, delay);
  o.target = score;
}
function layoutRows(cfg){
  var n = cfg.agents.length, idx = [], i;
  for(i=0;i<n;i++) idx.push(i);
  if(cfg.trierParScore !== false){
    idx.sort(function(a,b){
      var d = (Number(cfg.agents[b].ventes)||0) - (Number(cfg.agents[a].ventes)||0);
      return d !== 0 ? d : a - b;
    });
  }
  var perCol = Math.ceil(n / 2); if(perCol > PER_COL) perCol = PER_COL;
  var step = Math.min(ROW_H, Math.floor(836 / perCol));
  for(var pos=0; pos<n; pos++){
    var o = rowObjs[idx[pos]];
    var col = Math.floor(pos / perCol), r = pos % perCol;
    o.el.style.transform = 'translate(' + COL_X[col] + 'px,' + (ROW_Y0 + r*step) + 'px)';
    var sc = Number(cfg.agents[idx[pos]].ventes) || 0;
    var higher = 0;
    for(i=0;i<n;i++) if((Number(cfg.agents[i].ventes)||0) > sc) higher++;
    var rk = higher + 1;
    o.rank.textContent = sc > 0 ? rk : '–';
    o.rank.className = 'rank' + (sc > 0 && rk <= 3 ? ' r' + rk : '');
  }
}
function updateAgents(cfg, animateFrom){
  var s = cfg.agents.map(function(a){return a.nom;}).join('|');
  var rebuilt = false;
  if(s !== sig){ sig = s; buildRows(cfg); rebuilt = true; }
  var total = 0;
  for(var i=0;i<cfg.agents.length;i++){
    var sc = Math.max(0, Number(cfg.agents[i].ventes) || 0);
    total += sc;
    if(rebuilt || rowObjs[i].target !== sc) setGauge(rowObjs[i], sc, cfg, 0);
  }
  layoutRows(cfg);
  document.getElementById('totN').textContent = total;
  document.getElementById('subAg').textContent = 'Objectif : ' + cfg.objectif + ' ventes  ·  1 vente = 1 lot';
}
/* rejoue l'animation des jauges à l'entrée sur la page 3 */
function replayGauges(){
  if(!CFG) return;
  for(var i=0;i<rowObjs.length;i++){
    var o = rowObjs[i], f = o.fill.style, tgt = o.target;
    f.transition = 'none'; f.setProperty('--p', 0); o.shown = 0; o.num.textContent = '0';
    void o.fill.offsetWidth;
    f.transition = '';
    setGauge(o, tgt, CFG, 500 + i*70);
  }
}

function applyConfig(cfg, first){
  CFG = cfg;
  updateLots(cfg);
  updateAgents(cfg);
  if(first) replayGauges();
}

/* ---------- rafraîchissement automatique (relit ce fichier) ---------- */
function refresh(){
  var url = window.location.href.split('#')[0].split('?')[0] + '?_=' + Date.now();
  fetch(url, {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/<script id="config" type="application\/json">([\s\S]*?)<\/script>/);
    if(!m) return;
    try{ applyConfig(parseCfg(m[1])); errEl.classList.remove('show'); }
    catch(e){ errEl.classList.add('show'); }
  }).catch(function(){ /* hors-ligne ou ouverture locale : on garde les données actuelles */ });
}

/* =====================  CONFETTIS (page 1)  ===================== */
var cv = document.getElementById('confetti'), cx = cv.getContext('2d'), parts = [], s1On = false;
var COL = ['#ffd23f','#ffffff','#ff3d81','#00e5ff','#ff7b00','#b8ff5c'];
for(var q=0;q<110;q++) parts.push({x:Math.random()*1920,y:Math.random()*1080,w:10+Math.random()*14,h:16+Math.random()*18,
  vy:2+Math.random()*4,vx:-1+Math.random()*2,r:Math.random()*6.28,vr:-.08+Math.random()*.16,c:COL[q%COL.length]});
function loop(){
  if(s1On){
    cx.clearRect(0,0,1920,1080);
    for(var i=0;i<parts.length;i++){
      var p = parts[i]; p.y += p.vy; p.x += p.vx + Math.sin(p.y/60)*.8; p.r += p.vr;
      if(p.y > 1100){ p.y = -30; p.x = Math.random()*1920; }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = .9;
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h * Math.abs(Math.cos(p.r*1.3)+.2)); cx.restore();
    }
  }
  requestAnimationFrame(loop);
}
loop();

/* =====================  DIAPORAMA  ===================== */
var slides = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
var dots = document.querySelectorAll('#dots i'), prog = document.getElementById('prog');
var cur = -1, timer = null, valEl = document.getElementById('val');

function countValue(){
  var t0 = null;
  function st(ts){
    if(t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0 - 2000) / 1600);
    if(p < 0){ valEl.textContent = fmt(50); requestAnimationFrame(st); return; }
    valEl.textContent = fmt(Math.round(50 + (1700-50) * (1 - Math.pow(1-p,3))));
    if(p < 1) requestAnimationFrame(st);
  }
  valEl.textContent = fmt(50); requestAnimationFrame(st);
}
function show(i){
  var prev = cur; cur = i;
  if(prev >= 0 && prev !== i){
    var ps = slides[prev]; ps.classList.remove('active');
    (function(el){ setTimeout(function(){ if(el !== slides[cur]) el.classList.remove('on'); }, 1000); })(ps);
  }
  var s = slides[i]; s.classList.add('on'); void s.offsetWidth; s.classList.add('active');
  for(var d=0; d<dots.length; d++) dots[d].className = d === i ? 'on' : '';
  s1On = (i === 0);
  if(i === 0) countValue();
  if(i === 2) replayGauges();
  var dur = CFG ? CFG.dureeSlide : 10;
  prog.style.animation = 'none'; prog.style.width = '0'; void prog.offsetWidth;
  prog.style.animation = 'progx ' + dur + 's linear forwards';
  clearTimeout(timer); timer = setTimeout(function(){ show((cur+1) % slides.length); }, dur*1000);
}
var st = document.createElement('style');
st.textContent = '@keyframes progx{from{width:0}to{width:100%}}';
document.head.appendChild(st);

/* démarrage */
try{ applyConfig(parseCfg(document.getElementById('config').textContent), false); }
catch(e){ errEl.classList.add('show'); }
show(0);
setInterval(refresh, ((CFG && CFG.rafraichissement) || 15) * 1000);
setTimeout(refresh, 3000);

/* clavier (utile pour tester) : flèches = changer de page */
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') show((cur+1) % 3);
  if(e.key === 'ArrowLeft') show((cur+2) % 3);
});
</script>
</body>
</html>
